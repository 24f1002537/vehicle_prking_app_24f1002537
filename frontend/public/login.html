<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login / Register</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body{font-family:Arial} .box{max-width:360px;margin:70px auto;padding:25px;border:1px solid #ccc;border-radius:6px}
    .field{margin-bottom:15px;} label{display:block;margin-bottom:4px} input{width:100%;padding:8px}
    .toggle{color:#007bff;cursor:pointer;text-decoration:underline} .error{color:#d00;margin-top:10px}
    button{padding:8px 18px}
  </style>
</head>
<body>
<div id="app" class="box">
    <h1>{{message}}</h1>
  <h2 v-text="mode==='login' ? 'Login' : 'Register'"></h2>

  <div v-if="mode==='login'">
    <div class="field"><label>Email</label><input v-model="login.email" type="email"></div>
    <div class="field"><label>Password</label><input v-model="login.password" type="password"></div>
    <button @click="loginUser">Login</button>
    <p>Don’t have an account? <span class="toggle" @click="switchMode">Register</span></p>
  </div>

  <div v-else>
    <div class="field"><label>Email</label><input v-model="reg.email" type="email"></div>
    <div class="field"><label>Password</label><input v-model="reg.password" type="password"></div>
    <div class="field"><label>Address</label><input v-model="reg.address"></div>
    <div class="field"><label>Pincode</label><input v-model="reg.pincode"></div>
    <button @click="registerUser">Register</button>
    <p>Already registered? <span class="toggle" @click="switchMode">Login</span></p>
  </div>

  <div class="error" v-if="error">{{ error }}</div>
</div>

<script>
new Vue({
  el:'#app',
  data:{
    mode:'login',
    login:{ email:'', password:'' },
    reg:{ email:'', password:'', address:'', pincode:'' },
    error:''
  },
  methods:{
    switchMode(){ this.mode = this.mode==='login' ? 'register' : 'login'; this.error=''; },
    loginUser(){
      axios.post('http://localhost:5000/api/login', this.login)
        .then(res =>{ if (res.data.message === 'admin'){
            window.location.href = '/admin_dashboard.html';
        }else if (res.data.message === 'user'){
            window.location.href = '/user_dashboard.html';   
        } })
        .catch(err=>{ this.error = err.response?.data?.error || 'login failed'; });
    },
    registerUser(){
      axios.post('http://localhost:5000/api/register', this.reg)
        .then(()=>{ alert('Registered! Please login'); this.switchMode(); })
        .catch(err=>{ this.error = err.response?.data?.error || 'registration failed'; });
    }
  }
});
</script>
</body>
</html>
